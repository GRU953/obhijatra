<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Guard rule 3: nothing may run except our own code, and nothing may be
         sent anywhere except our own server. Even a successful injection has
         nowhere to send the data. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
                   img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co;
                   object-src 'none'; base-uri 'none'" />
    <!-- frame-ancestors is deliberately absent: a browser ignores it in a meta
         tag and warns. It must be sent as an HTTP header by whatever serves the
         website. Noted in docs/COMPLIANCE.md so it is not forgotten. -->
    <title>Obhijatra</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
