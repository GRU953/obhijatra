# Takes a locked copy of the whole database every night and puts it in three
# independent places. The free database plan keeps NO backups of its own, so
# without this one accidental delete is permanent.
name: Nightly backup
on:
  schedule: [{ cron: '0 18 * * *' }]   # midnight, Bangladesh time
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    # Only this workflow may write to the repository, and only to store a
    # backup as a release. Every other workflow stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Say which destinations are actually configured
        run: |
          echo "A backup that quietly does not happen is worse than none, so this"
          echo "reports the truth before anything runs."
          [ -n "${{ secrets.SUPABASE_DB_URL }}" ]      && echo "database access      : configured" || { echo "database access      : MISSING -- cannot back up at all"; exit 1; }
          [ -n "${{ secrets.BACKUP_PASSPHRASE }}" ]    && echo "backup password      : configured" || { echo "backup password      : MISSING -- refusing to store an unlocked backup"; exit 1; }
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && echo "copy 1 Cloudflare R2 : configured" || echo "copy 1 Cloudflare R2 : NOT configured (needs CLOUDFLARE_ACCOUNT_ID as well as the token)"
          [ -n "${{ secrets.B2_KEY_ID }}" ] && [ -n "${{ secrets.B2_ENDPOINT }}" ] && echo "copy 2 Backblaze B2  : configured" || echo "copy 2 Backblaze B2  : NOT configured (needs B2_ENDPOINT, e.g. https://s3.us-west-004.backblazeb2.com)"
          echo "copy 3 GitHub        : configured"

      - name: Fetch a backup tool that matches the server
        run: |
          # pg_dump refuses to read a database newer than itself. Build machines
          # ship an older one, so we ask the server its version and install the
          # matching tool. Doing it this way means a future server upgrade does
          # not silently stop the backups.
          SAFE=$(node scripts/normalise-db-url.mjs "$RAW")
          MAJOR=$(psql "$SAFE" -tAc "show server_version" | cut -d. -f1)
          echo "the server is PostgreSQL $MAJOR"
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$MAJOR"
          echo "PG_BIN=/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/$MAJOR/bin/pg_dump --version
        env:
          RAW: ${{ secrets.SUPABASE_DB_URL }}

      - name: Take the backup
        run: |
          SAFE=$(node scripts/normalise-db-url.mjs "$RAW")
          "$PG_BIN/pg_dump" "$SAFE" --no-owner --no-acl > dump.sql
          echo "dump size: $(du -h dump.sql | cut -f1)"
        env:
          RAW: ${{ secrets.SUPABASE_DB_URL }}

      - name: Check it is complete before trusting it
        run: node -e "import('./scripts/restore-rehearsal.mjs').then(m=>m.verifyRestore('dump.sql')).then(r=>console.log('backup contains',r.tables,'tables and',r.rows,'data blocks'))"

      - name: Lock it with a password
        run: |
          gpg --batch --yes --passphrase "${{ secrets.BACKUP_PASSPHRASE }}" \
              --symmetric --cipher-algo AES256 dump.sql
          rm -f dump.sql   # never keep the unlocked copy around
          echo "locked size: $(du -h dump.sql.gpg | cut -f1)"

      - name: Copy 1 of 3 — Cloudflare R2
        continue-on-error: true
        id: r2
        run: |
          # R2 speaks the same storage language as Backblaze, so one method
          # covers both and we need no extra tool. The address is built from
          # the account id, so there is one less thing to paste and mistype.
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "SKIPPED: needs R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY."
            echo "Get them from Cloudflare: R2 -> Manage R2 API Tokens -> Create API Token"
            echo "-> Object Read & Write. It shows an Access Key ID and a Secret Access Key."
            exit 1
          fi
          AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
          aws s3 cp dump.sql.gpg "s3://obhijatra-backups/$(date +%F).sql.gpg" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --checksum-algorithm CRC32
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Copy 2 of 3 — Backblaze B2
        continue-on-error: true
        id: b2
        run: |
          if [ -z "$B2_ENDPOINT" ]; then
            echo "SKIPPED: needs B2_ENDPOINT, e.g. https://s3.us-west-004.backblazeb2.com"; exit 0
          fi
          aws s3 cp dump.sql.gpg "s3://obhijatra-backups/$(date +%F).sql.gpg" --endpoint-url "$B2_ENDPOINT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

      - name: Copy 3 of 3 — GitHub release
        continue-on-error: true
        id: ghr
        run: gh release create "backup-$(date +%F)" dump.sql.gpg --notes "Automatic nightly backup. Locked with the backup password." || gh release upload "backup-$(date +%F)" dump.sql.gpg --clobber
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

      - name: Count how many copies actually landed
        run: |
          # Three copies exist so that one failing does not matter. Each is
          # therefore allowed to fail on its own. What is NOT allowed is for the
          # night to pass with too few copies and nobody noticing.
          n=0
          [ "${{ steps.r2.outcome }}" = "success" ] && { echo "copy 1 Cloudflare R2 : landed"; n=$((n+1)); } || echo "copy 1 Cloudflare R2 : FAILED"
          [ "${{ steps.b2.outcome }}" = "success" ] && { echo "copy 2 Backblaze B2  : landed"; n=$((n+1)); } || echo "copy 2 Backblaze B2  : FAILED"
          [ "${{ steps.ghr.outcome }}" = "success" ] && { echo "copy 3 GitHub        : landed"; n=$((n+1)); } || echo "copy 3 GitHub        : FAILED"
          echo
          echo "$n of 3 copies landed."
          if [ "$n" -lt 2 ]; then
            echo "::error::Fewer than two copies of the database survived tonight. Fix this before relying on the backups."
            exit 1
          fi
          [ "$n" -lt 3 ] && echo "::warning::Only $n of 3 copies landed. The data is safe, but a destination needs attention."
          exit 0

      - name: Apply the 35-day window to ALL THREE places
        if: always()
        run: |
          # Erasure is a legal right, and a copy kept for ever defeats it. The
          # first version of this step applied the window to GitHub only, so
          # Cloudflare and Backblaze quietly kept every backup ever taken --
          # which made "a deleted person is gone from every copy within 35 days"
          # untrue for two destinations out of three.
          #
          # Each file name carries its own date (2026-09-19.sql.gpg), so working
          # out what is old needs no extra call and behaves the same everywhere.
          CUTOFF=$(date -u -d '35 days ago' +%F)
          echo "clearing backups dated before $CUTOFF"

          prune () {   # $1 endpoint  $2 key id  $3 secret  $4 label
            if [ -z "$2" ] || [ -z "$1" ]; then echo "$4: not configured, skipped"; return 0; fi
            AWS_ACCESS_KEY_ID="$2" AWS_SECRET_ACCESS_KEY="$3" \
              aws s3 ls "s3://obhijatra-backups/" --endpoint-url "$1" \
              | awk '{print $4}' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.sql\.gpg$' \
              | while read -r key; do
                  if [ "${key%%.*}" \< "$CUTOFF" ]; then
                    AWS_ACCESS_KEY_ID="$2" AWS_SECRET_ACCESS_KEY="$3" \
                      aws s3 rm "s3://obhijatra-backups/$key" --endpoint-url "$1" >/dev/null \
                      && echo "$4: cleared $key"
                  fi
                done
            echo "$4: window applied"
          }

          prune "https://$CF_ACCOUNT.r2.cloudflarestorage.com" "$R2_KEY" "$R2_SECRET" "Cloudflare R2"
          prune "$B2_ENDPOINT" "$B2_KEY_ID" "$B2_KEY" "Backblaze B2"

          gh release list --limit 200 --json tagName,createdAt \
            --jq '.[] | select(.tagName | startswith("backup-")) | select(.createdAt < (now - 35*86400 | todate)) | .tagName' \
          | while read -r tag; do [ -n "$tag" ] && gh release delete "$tag" --yes --cleanup-tag && echo "GitHub: cleared $tag"; done
          echo "GitHub: window applied"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_KEY: ${{ secrets.B2_KEY }}
